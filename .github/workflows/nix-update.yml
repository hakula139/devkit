name: Nix Update

on:
  workflow_call:
    inputs:
      package:
        description: Flake attribute path of the package whose dependency hashes to refresh
        type: string
        default: default
    secrets:
      APP_ID:
        description: Client ID of the App that pushes the refresh commit
        required: true
      APP_PRIVATE_KEY:
        description: Private key of the App that pushes the refresh commit
        required: true

permissions:
  contents: read

jobs:
  update:
    name: Refresh Nix Hashes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.update.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Update hashes
        id: update
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail

          nix run nixpkgs#nix-update -- \
            --flake \
            --version=skip \
            "$PACKAGE"

          if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo '::error::nix-update wrote files outside the tracked tree'
            git status --short
            exit 1
          fi

          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

          patch="$RUNNER_TEMP/hash.patch"
          git diff --binary --no-ext-diff --no-textconv > "$patch"

          while IFS= read -r -d '' path; do
            if ! git ls-files --error-unmatch -- "$path" > /dev/null 2>&1; then
              echo "::error::$path is not tracked"
              exit 1
            fi
            if [[ "$path" == .github/workflows/* ]]; then
              echo "::error::$path is a workflow file"
              exit 1
            fi
          done < <(git diff --name-only -z)

      - name: Upload patch
        if: ${{ steps.update.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hash-patch
          path: ${{ runner.temp }}/hash.patch
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push Hash Commit
    # A fresh runner keeps the update job's Nix processes and any hooks they leave away from
    # the App token.
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@v8
        with:
          name: hash-patch
          path: ${{ runner.temp }}

      - name: Apply patch
        run: |
          set -euo pipefail

          patch="$RUNNER_TEMP/hash.patch"
          git apply --check --binary "$patch"
          git apply --binary "$patch"

          if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo '::error::the patch added a file outside the tracked tree'
            git status --short
            exit 1
          fi

          while IFS= read -r -d '' path; do
            if ! git ls-files --error-unmatch -- "$path" > /dev/null 2>&1; then
              echo "::error::$path is not tracked"
              exit 1
            fi
            if [[ "$path" == .github/workflows/* ]]; then
              echo "::error::$path is a workflow file"
              exit 1
            fi
          done < <(git diff --name-only -z)

          git add --update

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          bot="${SLUG}[bot]"
          user_id=$(gh api "users/${bot}" --jq .id)
          email="${user_id}+${bot}@users.noreply.github.com"

          git \
            -c "user.name=$bot" \
            -c "user.email=$email" \
            commit -m 'chore(deps): refresh Nix dependency hashes'

      - name: Push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          gh auth setup-git
          git \
            push \
              --force-with-lease="refs/heads/$BRANCH:$HEAD_SHA" \
              origin \
              "HEAD:refs/heads/$BRANCH"
