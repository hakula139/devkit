name: Tag Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      actions: read
      contents: write
    uses: $/.github/workflows/release.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  major-tag:
    name: Move the Major Tag
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the major tag
        run: |
          major=${GITHUB_REF_NAME%%.*}
          latest=$(git tag --list "$major.*" --sort=-v:refname | grep -v -m 1 -- -)
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "Skipping the major tag, since $latest is newer than $GITHUB_REF_NAME"
            exit 0
          fi

          git tag -f "$major"
          git push origin "refs/tags/$major" --force
