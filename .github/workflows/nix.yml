name: Nix

on:
  workflow_call:
    inputs:
      macos:
        description: Also run the macOS leg
        type: boolean
        default: true
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Upload token for the `hakula` Cachix cache

permissions:
  contents: read

jobs:
  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["Linux", "macOS"]' || '["Linux"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: $/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake check
        run: |
          nix flake check \
            --keep-going \
            --print-build-logs \
            ${{ matrix.os == 'Linux' && '--all-systems' || '' }}
