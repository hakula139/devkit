# cspell:ignore niks numtide
name: Debug substituters

on:
  pull_request:

permissions:
  contents: read

jobs:
  before:
    name: Before (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Show substituters
        run: |
          nix config show | grep -E '^(extra-)?(substituters|trusted-public-keys)'
          cat ~/.config/nix/nix.conf || true

  after:
    name: After (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Show substituters
        run: |
          nix config show | grep -E '^(extra-)?(substituters|trusted-public-keys)'
          cat ~/.config/nix/nix.conf || true
