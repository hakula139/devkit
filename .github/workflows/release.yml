name: Release

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Token that pushes and pins the `hakula` Cachix cache
        required: true

permissions:
  contents: read

jobs:
  tagged-ci:
    name: Check Tagged Commit CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the tagged commit
        uses: $/actions/tagged-ci

  nix-cache:
    needs: tagged-ci
    uses: $/.github/workflows/nix-cache.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    name: Publish GitHub Release
    needs: nix-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish release
        uses: $/actions/publish-release
