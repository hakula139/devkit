name: Nix Cache

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Token that pushes and pins the `hakula` Cachix cache
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHIX_NAME: hakula

jobs:
  pin:
    name: Pin (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: $/actions/setup-nix

      - name: Build and pin package
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SYSTEM: ${{ matrix.system }}
        run: |
          store_path=$(nix build --no-link --print-out-paths --print-build-logs .#default.out)
          cachix push "$CACHIX_NAME" "$store_path"
          cachix pin "$CACHIX_NAME" "${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-${SYSTEM}" \
            "$store_path" --keep-revisions 1
