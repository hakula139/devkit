name: Publish release
description: Publish a GitHub Release with changelog or tag notes

inputs:
  notes-source:
    description: Release notes source, either changelog or tag
    default: changelog
  assets:
    description: Newline-separated globs to attach, relative to the repository root

runs:
  using: composite
  steps:
    - name: Install changelog parser
      if: ${{ inputs.notes-source == 'changelog' }}
      uses: taiki-e/install-action@parse-changelog

    - name: Publish release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NOTES_SOURCE: ${{ inputs.notes-source }}
        ASSETS: ${{ inputs.assets }}
      run: bash "$GITHUB_ACTION_PATH/publish-release.sh"
