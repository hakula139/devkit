name: Nix Cache

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Token that pushes and pins the `hakula` Cachix cache
        required: true

permissions:
  contents: read

env:
  CACHIX_NAME: hakula

jobs:
  pin:
    name: Pin (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Build and pin package
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SYSTEM: ${{ matrix.system }}
        run: |
          pin="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-${SYSTEM}"
          store_path=$(
            nix build .#default.out \
              --no-link \
              --print-out-paths \
              --print-build-logs
          )
          cachix push "$CACHIX_NAME" "$store_path"
          cachix pin "$CACHIX_NAME" "$pin" "$store_path" --keep-revisions 1
