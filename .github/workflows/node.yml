name: Node

on:
  workflow_call:
    inputs:
      coverage:
        description: Upload the `coverage/lcov.info` that the tests write to Codecov
        type: boolean
        default: true
      macos:
        description: Also run the macOS leg
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Upload token for the `hakula` Cachix cache
      CODECOV_TOKEN:
        description: Upload token for Codecov

permissions:
  contents: read

jobs:
  node:
    name: Node Check (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["Linux", "macOS"]' || '["Linux"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Run tests
        run: nix develop -c pnpm test

      - name: Upload to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
