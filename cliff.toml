[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), \
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Tera's `sort` rejects a null key, so unscoped entries render first in their own loop.
body = """

{% if version -%}
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}

    {% for commit in commits -%}
        {% if not commit.scope -%}
            - {{ commit.message | upper_first | trim }}
        {% endif -%}
    {% endfor -%}
    {% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
        - _({{ commit.scope }})_ {{ commit.message | upper_first | trim }}
    {% endfor %}
{%- endfor -%}
"""

trim = true
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# Stable release boundaries include all changes from their prereleases.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'

commit_preprocessors = [
  # Backtick inline HTML so Markdown renders it as code. `(^|[^`])` stands in for the lookbehind
  # that Rust regex lacks, so already-fenced spans stay as they are.
  { pattern = '(^|[^`])(<\/?[a-zA-Z][^>]*>)', replace = '$1`$2`' },
]

# `<!-- N -->` prefixes, which the body template strips, order the sections. The first match wins,
# so the breaking `!:` parser precedes the type prefixes. `filter_commits` drops the other types.
commit_parsers = [
  { message = '^[a-z]+(\([^)]+\))?!:', group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Changed" },
]
