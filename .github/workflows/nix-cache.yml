name: Nix Cache

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Token that pushes and pins the `hakula` Cachix cache
        required: true

permissions:
  contents: read

jobs:
  pin:
    name: Pin (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PIN_NAME: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Build and pin package
        uses: $/.github/actions/cachix-pin
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          pins: '{"${{ env.PIN_NAME }}": ".#default.out"}'
          keep-revisions: 1
