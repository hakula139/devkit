name: Tag Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tagged-ci:
    name: Check Tagged Commit CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read

    steps:
      - name: Wait for CI on the tagged commit
        uses: $/.github/actions/tagged-ci

  npm:
    name: Publish npm Package
    needs: tagged-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      # A tag checkout is on no branch, which pnpm's git checks reject.
      - name: Publish package
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            tag=next
          fi

          nix develop -c pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          nix develop -c pnpm publish \
            --provenance \
            --no-git-checks \
            --tag "$tag"

  publish:
    name: Publish GitHub Release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish release
        uses: $/.github/actions/publish-release

  major-tag:
    name: Move the Major Tag
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    concurrency:
      group: ${{ github.workflow }}-major-tag
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-tags: true

      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          latest=$(
            git tag \
              --list "$major.*" \
              --sort=-v:refname \
              | grep \
                -v \
                -m 1 \
                -e -
          )
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "Skipping the major tag, since $latest is newer than $GITHUB_REF_NAME"
            exit 0
          fi

          git tag -f "$major"
          git push origin "refs/tags/$major" --force
