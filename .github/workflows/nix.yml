name: Nix

on:
  workflow_call:
    inputs:
      macos:
        description: Also run the macOS leg
        type: boolean
        default: true
      sparse-checkout:
        description: Sparse-checkout patterns passed to actions/checkout, which uses non-cone mode when supplied
        type: string
        default: ''
      submodules:
        description: Check out submodules
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Upload token for the `hakula` Cachix cache

permissions:
  contents: read

jobs:
  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["Linux", "macOS"]' || '["Linux"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Supplied patterns use non-cone semantics, which allows negative exclusions.
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout == '' }}
          submodules: ${{ inputs.submodules }}

      - name: Set up Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake check
        run: |
          nix flake check \
            --keep-going \
            --print-build-logs \
            ${{ matrix.os == 'Linux' && '--all-systems' || '' }}

      - name: Run hooks
        if: ${{ !cancelled() && matrix.os == 'Linux' }}
        run: nix develop -c run-hooks

      - name: Build dev shell
        if: ${{ !cancelled() && matrix.os == 'macOS' }}
        run: nix develop -c true
