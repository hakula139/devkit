[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), \
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Tera's `sort` rejects a null key, so unscoped entries render first in their own loop.
body = """
{% set pr_link = "([#$1](https://github.com/" \
    ~ remote.github.owner \
    ~ "/" \
    ~ remote.github.repo \
    ~ "/pull/$1))" %}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## Unreleased
{% endif %}
{% if message %}
    ### Highlights

    {{ message | trim }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}

    {% for commit in commits -%}
        {% if not commit.scope -%}
            - {{ commit.message \
                | replace_regex(from="[(]#([0-9]+)[)]", to=pr_link) \
                | upper_first \
                | trim }}
        {% endif -%}
    {% endfor -%}
    {% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
        - _({{ commit.scope }})_ {{ commit.message \
            | replace_regex(from="[(]#([0-9]+)[)]", to=pr_link) \
            | upper_first \
            | trim }}
    {% endfor %}
{%- endfor -%}
{% if version %}

[{{ version | trim_start_matches(pat="v") }}]: \
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/\
{% if previous.version %}compare/{{ previous.version }}...{{ version }}\
{% else %}releases/tag/{{ version }}{% endif %}
{% endif %}
"""

trim = true
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# Stable release boundaries include all changes from their prereleases.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'

commit_preprocessors = [
  # Backtick inline HTML so Markdown renders it as code. `(^|[^`])` stands in for the lookbehind
  # that Rust regex lacks, so tags already enclosed in backticks stay as they are.
  { pattern = '(^|[^`])(<\/?[a-zA-Z][^>]*>)', replace = '$1`$2`' },
]

# `<!-- N -->` prefixes, which the body template strips, order the sections.
commit_parsers = [
  { field = "breaking", pattern = "^true$", group = "<!-- 0 -->Breaking changes" },
  { message = '^feat(\([^)]+\))?:', group = "<!-- 1 -->Added" },
  { message = '^fix(\([^)]+\))?:', group = "<!-- 2 -->Fixed" },
  { message = '^perf(\([^)]+\))?:', group = "<!-- 3 -->Changed" },
]
