name: Rust

on:
  workflow_call:
    inputs:
      all_features:
        description: Pass `--all-features` to every Cargo command
        type: boolean
        default: false
      coverage:
        description: Measure test coverage with `cargo llvm-cov` and upload it to Codecov
        type: boolean
        default: true
      macos:
        description: Also run the macOS leg
        type: boolean
        default: true
      msrv:
        description: Also check the MSRV in the `msrv` dev shell
        type: boolean
        default: false
      sparse-checkout:
        description: Sparse-checkout patterns passed to actions/checkout, which uses non-cone mode when supplied
        type: string
        default: ''
      submodules:
        description: Check out submodules
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Upload token for the `hakula` Cachix cache

permissions:
  contents: read

jobs:
  rust:
    name: Rust Check (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["Linux", "macOS"]' || '["Linux"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Supplied patterns use non-cone semantics, which allows negative exclusions.
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout == '' }}
          submodules: ${{ inputs.submodules }}

      - name: Set up Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}
          save-if: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Run clippy
        if: ${{ matrix.os == 'macOS' }}
        run: |
          nix develop -c cargo clippy \
            --locked \
            --all-targets \
            ${{ inputs.all_features && '--all-features' || '' }}

      - name: Run tests
        run: |
          nix develop -c cargo ${{ inputs.coverage && 'llvm-cov' || 'test' }} \
            --locked \
            ${{ inputs.all_features && '--all-features' || '' }} \
            ${{ inputs.coverage && '--lcov --output-path lcov.info' || '' }}

      - name: Upload to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true

      - name: Run doc tests
        if: ${{ inputs.coverage }}
        run: |
          nix develop -c cargo test \
            --locked \
            --doc \
            ${{ inputs.all_features && '--all-features' || '' }}

  msrv:
    name: MSRV Check
    if: ${{ inputs.msrv }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Supplied patterns use non-cone semantics, which allows negative exclusions.
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout == '' }}
          submodules: ${{ inputs.submodules }}

      - name: Set up Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop .#msrv -c {0}
          save-if: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Check MSRV
        run: |
          nix develop .#msrv -c cargo check \
            --locked \
            --workspace \
            --all-targets \
            ${{ inputs.all_features && '--all-features' || '' }}
