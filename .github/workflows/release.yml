name: Release

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Token that pushes and pins the `hakula` Cachix cache
        required: true

permissions:
  contents: read

jobs:
  tagged-ci:
    name: Check Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Check the package version
        run: |
          version=$(nix eval --raw .#default.version)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi

          if [[ -f .claude-plugin/plugin.json ]]; then
            plugin_version=$(jq -r '.version // empty' .claude-plugin/plugin.json)
            if [[ -n "$plugin_version" && "$plugin_version" != "$version" ]]; then
              echo "::error file=.claude-plugin/plugin.json::Plugin version $plugin_version does not match the package version $version"
              exit 1
            fi
          fi

      - name: Wait for CI on the tagged commit
        uses: $/.github/actions/tagged-ci

  nix-cache:
    needs: tagged-ci
    uses: $/.github/workflows/nix-cache.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    name: Publish GitHub Release
    needs: nix-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish release
        uses: $/.github/actions/publish-release
