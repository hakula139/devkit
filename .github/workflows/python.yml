name: Python

on:
  workflow_call:
    inputs:
      coverage:
        description: Upload the `coverage.xml` that pytest writes to Codecov
        type: boolean
        default: true
      macos:
        description: Also run the macOS leg
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Upload token for the `hakula` Cachix cache

permissions:
  contents: read

jobs:
  python:
    name: Python Check (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["Linux", "macOS"]' || '["Linux"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run tests
        run: nix develop -c uv run --locked pytest

      - name: Upload to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
