name: Deploy Cloudflare Worker

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token for the production Worker
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account that owns the Worker
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: workers-production
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Deploy
        uses: $/.github/actions/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
