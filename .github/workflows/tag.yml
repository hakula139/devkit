name: Tag Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tagged-ci:
    name: Check Tagged Commit CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read

    steps:
      - name: Wait for CI on the tagged commit
        uses: $/.github/actions/tagged-ci

  publish:
    name: Publish GitHub Release
    needs: tagged-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish release
        uses: $/.github/actions/publish-release

  major-tag:
    name: Move the Major Tag
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          latest=$(
            git tag \
              --list "$major.*" \
              --sort=-v:refname \
              | grep \
                -v \
                -m 1 \
                -e -
          )
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "Skipping the major tag, since $latest is newer than $GITHUB_REF_NAME"
            exit 0
          fi

          git tag -f "$major"
          git push origin "refs/tags/$major" --force
