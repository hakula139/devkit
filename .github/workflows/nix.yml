name: Nix

on:
  workflow_call:
    inputs:
      macos:
        description: Also run the macOS job
        type: boolean
        default: true
      build:
        description: Build the default package after the flake check
        type: boolean
        default: true
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Upload token for the hakula Cachix cache
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Nix (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        # `$/` resolves to this repository at the running commit, so the workflow uses the
        # actions from the same release as the caller's `@v1`.
        uses: $/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake check
        run: nix flake check --keep-going --print-build-logs

      - name: Build package
        if: ${{ !cancelled() && inputs.build }}
        run: nix build --no-link --print-build-logs

  macos:
    name: Nix (macOS)
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: $/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake check
        run: nix flake check --keep-going --print-build-logs

      - name: Build package
        if: ${{ !cancelled() && inputs.build }}
        run: nix build --no-link --print-build-logs
