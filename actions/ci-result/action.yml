name: CI Result
description: Fail unless every completed job in this run attempt succeeded or was skipped

inputs:
  check_run_id:
    description: This job's check run ID, passed as job.check_run_id
    required: true

runs:
  using: composite
  steps:
    - name: Check results
      # bash sets pipefail, so a failed API call fails the gate.
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GATE_ID: ${{ inputs.check_run_id }}
      run: |
        # `needs` misses a matrix leg cancelled before it starts, so read each job from the API.
        failed=$(
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --paginate \
            --slurp |
            jq -r --argjson gate "$GATE_ID" -f "$GITHUB_ACTION_PATH/ci-result.jq"
        )

        if [[ -n "$failed" ]]; then
          echo "$failed"
          exit 1
        fi
