name: Tagged CI
description: Wait for a push or dispatched workflow run to pass on the tagged commit

inputs:
  workflow:
    description: CI workflow filename
    default: ci.yml

runs:
  using: composite
  steps:
    - name: Wait for CI on the tagged commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: bash "$GITHUB_ACTION_PATH/tagged-ci.sh"
