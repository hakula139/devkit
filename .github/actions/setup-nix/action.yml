name: Set up Nix
description: Install Nix and configure the `hakula` Cachix cache

inputs:
  cachix_auth_token:
    description: Upload token, used only on the default branch
  extra_nix_config:
    description: Additional Nix configuration lines, appended after `fallback = true`

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        # `fallback = true` builds a path whose substitute fails to download, which Nix would
        # otherwise report as a failed build.
        extra_nix_config: |
          fallback = true
          ${{ inputs.extra_nix_config }}

    - name: Set up Cachix
      # Also covers the action's post step, which pushes the job's builds.
      continue-on-error: true
      uses: cachix/cachix-action@v17
      with:
        name: hakula
        authToken: ${{ inputs.cachix_auth_token }}
        skipPush: >-
          ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
